<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
<style>
.bg{fill:#000}.h{font:600 16px sans-serif;fill:#A7E58F}.t{font:600 14px sans-serif;fill:#fff}
.s{font:11px sans-serif;fill:#9CA3AF}.cnt{font:bold 32px sans-serif;fill:#A7E58F}
.cntE{font:bold 32px sans-serif;fill:#5A6068}.tab{font:10px sans-serif;fill:#A7E58F}.ver{font:9px sans-serif;fill:#9CA3AF}
</style>
<rect class="bg" width="360" height="740"/>
<!-- Header -->
<rect width="360" height="60" fill="#0F1B17"/>
<g aria-label="Avoclock Logo"><circle cx="30" cy="32" r="14" fill="#0F4B2D"/><circle cx="30" cy="32" r="11.6" fill="#F3EBD3"/><circle cx="30" cy="32" r="7.8" fill="#3E9B2A"/><circle cx="30" cy="32" r="5.6" fill="#C9E86A"/><circle cx="30" cy="32" r="2.7" fill="#8A3A1B"/><line x1="30" y1="32" x2="25.5" y2="29" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/><line x1="30" y1="32" x2="34" y2="26.5" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/></g>
<text x="56" y="30" class="h">Avoclock</text>
<rect x="134" y="19" width="44" height="15" rx="4" fill="#1F2E29"/>
<text x="156" y="30" text-anchor="middle" class="ver">v5.12.7</text>
<text x="56" y="47" class="s" font-size="12">18:41</text>
<circle cx="282" cy="32" r="4.5" fill="#B91C1C"/>
<text x="322" y="39" text-anchor="middle" font-size="20">⚙️</text>
<line x1="0" y1="60" x2="360" y2="60" stroke="#A7E58F" stroke-width="0.5"/>
<!-- Title -->
<text x="14" y="92" class="h" style="font-size:20px">🏪 Lagerorte</text>
<!-- Raster 2 Spalten, 6 Standorte -->
<rect x="14" y="110" width="160" height="200" rx="14" fill="#0F1B17" stroke="#DBEAFE" stroke-width="2"/>
<circle cx="94" cy="170" r="34" fill="#DBEAFE"/>
<text x="94" y="181" text-anchor="middle" font-size="32">🧊</text>
<text x="94" y="240" text-anchor="middle" class="t">Kühlschr.</text>
<text x="94" y="282" text-anchor="middle" class="cnt">11</text>

<rect x="186" y="110" width="160" height="200" rx="14" fill="#0F1B17" stroke="#CFFAFE" stroke-width="2"/>
<circle cx="266" cy="170" r="34" fill="#CFFAFE"/>
<text x="266" y="181" text-anchor="middle" font-size="32">❄️</text>
<text x="266" y="240" text-anchor="middle" class="t">Gefrierfach</text>
<text x="266" y="282" text-anchor="middle" class="cnt">6</text>

<rect x="14" y="320" width="160" height="200" rx="14" fill="#0F1B17" stroke="#A5F3FC" stroke-width="2"/>
<circle cx="94" cy="380" r="34" fill="#A5F3FC"/>
<text x="94" y="391" text-anchor="middle" font-size="32">🥶</text>
<text x="94" y="450" text-anchor="middle" class="t">Truhe Keller</text>
<text x="94" y="492" text-anchor="middle" class="cnt">2</text>

<rect x="186" y="320" width="160" height="200" rx="14" fill="#0F1B17" stroke="#FEF3C7" stroke-width="2"/>
<circle cx="266" cy="380" r="34" fill="#FEF3C7"/>
<text x="266" y="391" text-anchor="middle" font-size="32">📦</text>
<text x="266" y="450" text-anchor="middle" class="t">Kammer</text>
<text x="266" y="492" text-anchor="middle" class="cnt">4</text>

<!-- untere Reihe, von der Tab-Leiste angeschnitten -->
<rect x="14" y="530" width="160" height="200" rx="14" fill="#0F1B17" stroke="#FCE7F3" stroke-width="2"/>
<circle cx="94" cy="590" r="34" fill="#FCE7F3"/>
<text x="94" y="601" text-anchor="middle" font-size="32">🍷</text>
<text x="94" y="660" text-anchor="middle" class="t">Weinkeller</text>
<text x="94" y="716" text-anchor="middle" class="cnt">1</text>

<rect x="186" y="530" width="160" height="200" rx="14" fill="#0F1B17" stroke="#F3F4F6" stroke-width="2"/>
<circle cx="266" cy="590" r="34" fill="#F3F4F6"/>
<text x="266" y="601" text-anchor="middle" font-size="32">🏠</text>
<text x="266" y="660" text-anchor="middle" class="t">Sonstige</text>
<text x="266" y="716" text-anchor="middle" class="cntE">0</text>

<!-- Tab bar (5 Tabs, je 72 breit; Ansicht kommt von der Start-Kachel) -->
<rect x="0" y="690" width="360" height="50" fill="#0F1B17"/>
<line x1="0" y1="690" x2="360" y2="690" stroke="#1A3C34" stroke-width="1"/>
<rect x="4" y="694" width="64" height="44" rx="8" fill="#14241E"/>
<text x="36" y="715" text-anchor="middle" font-size="18">🏠</text><text x="36" y="731" text-anchor="middle" class="tab">Start</text>
<text x="108" y="715" text-anchor="middle" font-size="18">📋</text><text x="108" y="731" text-anchor="middle" class="tab">Vorrat</text>
<text x="180" y="715" text-anchor="middle" font-size="18">🛒</text><text x="180" y="731" text-anchor="middle" class="tab">Einkauf</text>
<text x="252" y="715" text-anchor="middle" font-size="18">📅</text><text x="252" y="731" text-anchor="middle" class="tab">Termine</text>
<text x="324" y="715" text-anchor="middle" font-size="18">🍳</text><text x="324" y="731" text-anchor="middle" class="tab">Rezepte</text>
</svg>
