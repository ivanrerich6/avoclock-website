<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
<defs>
<linearGradient id="bgScan" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1A4034"/><stop offset="100%" stop-color="#2A5A2A"/>
</linearGradient>
<linearGradient id="bgRezept" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#5C2D0E"/><stop offset="100%" stop-color="#7A3F18"/>
</linearGradient>
<style>
.bg{fill:#000}.h{font:600 13px sans-serif;fill:#A7E58F}.s{font:11px sans-serif;fill:#9CA3AF}
.t{font:600 16px sans-serif;fill:#fff}.tl{font:600 18px sans-serif;fill:#fff}
.ico{font:28px sans-serif}.tab{font:10px sans-serif;fill:#A7E58F}
</style>
</defs>
<rect class="bg" width="360" height="740"/>
<!-- Header -->
<circle cx="30" cy="32" r="14" fill="#F5F5DC" stroke="#1A3C34" stroke-width="2"/>
<text x="32" y="36" text-anchor="middle" font-size="11" fill="#1A3C34" font-weight="bold">A</text>
<text x="56" y="30" class="h" font-size="16">Avoclock</text>
<text x="125" y="30" font-size="9" fill="#A7E58F">v5.9.8</text>
<text x="56" y="46" class="s">11:34</text>
<rect x="280" y="22" width="62" height="22" rx="11" fill="#7F1D1D"/>
<text x="311" y="37" text-anchor="middle" font-size="10" fill="#fff">● Offline</text>
<line x1="0" y1="60" x2="360" y2="60" stroke="#A7E58F" stroke-width="0.5"/>

<!-- Scan Tile -->
<rect x="14" y="76" width="332" height="86" rx="14" fill="url(#bgScan)" stroke="#4A8C2A"/>
<text x="180" y="115" text-anchor="middle" font-size="32">📷</text>
<text x="180" y="142" text-anchor="middle" class="t">Barcode scannen</text>

<!-- Rezepte Tile -->
<rect x="14" y="174" width="332" height="100" rx="14" fill="url(#bgRezept)" stroke="#EA580C"/>
<text x="180" y="212" text-anchor="middle" font-size="30">🍳</text>
<text x="180" y="238" text-anchor="middle" class="t">Rezepte</text>
<text x="180" y="258" text-anchor="middle" class="s" fill="#FED7AA">Mexikanische Reispfanne (6/6 Zutaten)</text>

<!-- Vorrat / Einkauf -->
<rect x="14" y="286" width="160" height="100" rx="14" fill="#0F1B17" stroke="#1A3C34"/>
<text x="94" y="320" text-anchor="middle" class="ico">📋</text>
<text x="94" y="350" text-anchor="middle" class="t">Vorrat</text>
<text x="94" y="368" text-anchor="middle" class="s">19 Produkte, 1 bald MHD</text>

<rect x="186" y="286" width="160" height="100" rx="14" fill="#0F1B17" stroke="#1A3C34"/>
<text x="266" y="320" text-anchor="middle" class="ico">🛒</text>
<text x="266" y="350" text-anchor="middle" class="t">Einkauf</text>
<text x="266" y="368" text-anchor="middle" class="s">0 offen</text>

<!-- Orte / Termine -->
<rect x="14" y="398" width="160" height="100" rx="14" fill="#0F1B17" stroke="#1A3C34"/>
<text x="94" y="430" text-anchor="middle" class="ico">🏪</text>
<text x="94" y="460" text-anchor="middle" class="t">Orte</text>
<text x="94" y="478" text-anchor="middle" class="s">7 Standorte</text>

<rect x="186" y="398" width="160" height="100" rx="14" fill="#0F1B17" stroke="#1A3C34"/>
<rect x="252" y="412" width="28" height="32" rx="3" fill="#fff"/>
<rect x="252" y="412" width="28" height="9" fill="#DC2626"/>
<text x="266" y="420" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">MAI</text>
<text x="266" y="438" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">14</text>
<text x="266" y="460" text-anchor="middle" class="t">Termine</text>
<text x="266" y="478" text-anchor="middle" class="s">5 aktiv</text>

<!-- Statistik / Manuell -->
<rect x="14" y="510" width="160" height="100" rx="14" fill="#0F1B17" stroke="#1A3C34"/>
<text x="94" y="542" text-anchor="middle" class="ico">📊</text>
<text x="94" y="572" text-anchor="middle" class="t">Statistik</text>
<text x="94" y="590" text-anchor="middle" class="s">Übersicht</text>

<rect x="186" y="510" width="160" height="100" rx="14" fill="#0F1B17" stroke="#1A3C34"/>
<text x="266" y="542" text-anchor="middle" class="ico">+</text>
<text x="266" y="572" text-anchor="middle" class="t">Manuell</text>
<text x="266" y="590" text-anchor="middle" class="s">EAN oder Vorlage</text>

<!-- Tab bar -->
<rect x="0" y="690" width="360" height="50" fill="#0F1B17"/>
<text x="33" y="715" text-anchor="middle" font-size="18">🏠</text><text x="33" y="730" text-anchor="middle" class="tab">Start</text>
<text x="79" y="715" text-anchor="middle" font-size="18">📋</text><text x="79" y="730" text-anchor="middle" class="tab">Vorrat</text>
<text x="125" y="715" text-anchor="middle" font-size="18">🛒</text><text x="125" y="730" text-anchor="middle" class="tab">Einkauf</text>
<text x="179" y="715" text-anchor="middle" font-size="18">🏪</text><text x="179" y="730" text-anchor="middle" class="tab">Orte</text>
<text x="233" y="715" text-anchor="middle" font-size="18">📊</text><text x="233" y="730" text-anchor="middle" class="tab">Statistik</text>
<text x="287" y="715" text-anchor="middle" font-size="18">📅</text><text x="287" y="730" text-anchor="middle" class="tab">Kal.</text>
<text x="333" y="715" text-anchor="middle" font-size="18">🍳</text><text x="333" y="730" text-anchor="middle" class="tab">Rezepte</text>
</svg>
