<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
<defs>
<linearGradient id="bgScan" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#4A8C2A"/><stop offset="100%" stop-color="#1A3C34"/>
</linearGradient>
<linearGradient id="bgRezept" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#D9530F"/><stop offset="100%" stop-color="#1F2E22"/>
</linearGradient>
<style>
.bg{fill:#000}.h{font:600 16px sans-serif;fill:#A7E58F}.s{font:11px sans-serif;fill:#9CA3AF}
.t{font:600 16px sans-serif;fill:#fff}.tl{font:600 18px sans-serif;fill:#fff}
.ico{font:28px sans-serif}.tab{font:10px sans-serif;fill:#A7E58F}.ver{font:9px sans-serif;fill:#9CA3AF}
</style>
</defs>
<rect class="bg" width="360" height="740"/>
<!-- Header -->
<rect width="360" height="60" fill="#0F1B17"/>
<g aria-label="Avoclock Logo"><circle cx="30" cy="32" r="14" fill="#0F4B2D"/><circle cx="30" cy="32" r="11.6" fill="#F3EBD3"/><circle cx="30" cy="32" r="7.8" fill="#3E9B2A"/><circle cx="30" cy="32" r="5.6" fill="#C9E86A"/><circle cx="30" cy="32" r="2.7" fill="#8A3A1B"/><line x1="30" y1="32" x2="25.5" y2="29" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/><line x1="30" y1="32" x2="34" y2="26.5" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/></g>
<text x="56" y="30" class="h" font-size="16">Avoclock</text>
<rect x="134" y="19" width="44" height="15" rx="4" fill="#1F2E29"/>
<text x="156" y="30" text-anchor="middle" class="ver">v5.12.7</text>
<text x="56" y="47" class="s" font-size="12">18:41</text>
<circle cx="282" cy="32" r="4.5" fill="#B91C1C"/>
<text x="322" y="39" text-anchor="middle" font-size="20">⚙️</text>
<line x1="0" y1="60" x2="360" y2="60" stroke="#A7E58F" stroke-width="0.5"/>

<!-- Scan Tile -->
<rect x="14" y="76" width="332" height="112" rx="16" fill="url(#bgScan)" stroke="#4A8C2A"/>
<text x="180" y="128" text-anchor="middle" font-size="36">📷</text>
<text x="180" y="166" text-anchor="middle" class="tl">Barcode scannen</text>

<!-- Rezepte Tile -->
<rect x="14" y="202" width="332" height="124" rx="16" fill="url(#bgRezept)" stroke="#EA580C" stroke-width="1.5"/>
<text x="180" y="254" text-anchor="middle" font-size="32">🍳</text>
<text x="180" y="286" text-anchor="middle" class="tl">Rezepte</text>
<text x="180" y="308" text-anchor="middle" class="s" font-size="13" fill="#FED7AA">155 Ideen</text>

<!-- Vorrat / Einkauf -->
<rect x="14" y="340" width="160" height="110" rx="16" fill="#0F1B17" stroke="#1A3C34"/>
<text x="94" y="384" text-anchor="middle" class="ico">📋</text>
<text x="94" y="412" text-anchor="middle" class="t">Vorrat</text>
<text x="94" y="432" text-anchor="middle" class="s" font-size="12">24 Produkte</text>

<rect x="186" y="340" width="160" height="110" rx="16" fill="#0F1B17" stroke="#1A3C34"/>
<text x="266" y="384" text-anchor="middle" class="ico">🛒</text>
<text x="266" y="412" text-anchor="middle" class="t">Einkauf</text>
<text x="266" y="432" text-anchor="middle" class="s" font-size="12">3 offen</text>

<!-- Orte / Termine -->
<rect x="14" y="464" width="160" height="110" rx="16" fill="#0F1B17" stroke="#1A3C34"/>
<text x="94" y="508" text-anchor="middle" class="ico">🏪</text>
<text x="94" y="536" text-anchor="middle" class="t">Orte</text>
<text x="94" y="556" text-anchor="middle" class="s" font-size="12">6 Standorte</text>

<rect x="186" y="464" width="160" height="110" rx="16" fill="#0F1B17" stroke="#1A3C34"/>
<rect x="252" y="480" width="28" height="32" rx="3" fill="#fff"/>
<rect x="252" y="480" width="28" height="9" fill="#DC2626"/>
<text x="266" y="488" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">NOV</text>
<text x="266" y="507" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">1</text>
<text x="266" y="536" text-anchor="middle" class="t">Termine</text>
<text x="266" y="556" text-anchor="middle" class="s" font-size="12">8 aktiv</text>

<!-- Statistik / Manuell (unten angeschnitten) -->
<rect x="14" y="588" width="160" height="110" rx="16" fill="#0F1B17" stroke="#1A3C34"/>
<text x="94" y="632" text-anchor="middle" class="ico">📊</text>
<text x="94" y="660" text-anchor="middle" class="t">Statistik</text>
<text x="94" y="680" text-anchor="middle" class="s" font-size="12">Übersicht</text>

<rect x="186" y="588" width="160" height="110" rx="16" fill="#0F1B17" stroke="#1A3C34"/>
<text x="266" y="632" text-anchor="middle" class="ico">➕</text>
<text x="266" y="660" text-anchor="middle" class="t">Manuell</text>
<text x="266" y="680" text-anchor="middle" class="s" font-size="12">EAN oder Vorlage</text>

<!-- Tab bar (5 Tabs, je 72 breit) -->
<rect x="0" y="690" width="360" height="50" fill="#0F1B17"/>
<line x1="0" y1="690" x2="360" y2="690" stroke="#1A3C34" stroke-width="1"/>
<rect x="4" y="694" width="64" height="44" rx="8" fill="#1A3C34"/>
<text x="36" y="715" text-anchor="middle" font-size="18">🏠</text><text x="36" y="731" text-anchor="middle" class="tab">Start</text>
<text x="108" y="715" text-anchor="middle" font-size="18">📋</text><text x="108" y="731" text-anchor="middle" class="tab">Vorrat</text>
<text x="180" y="715" text-anchor="middle" font-size="18">🛒</text><text x="180" y="731" text-anchor="middle" class="tab">Einkauf</text>
<text x="252" y="715" text-anchor="middle" font-size="18">📅</text><text x="252" y="731" text-anchor="middle" class="tab">Termine</text>
<text x="324" y="715" text-anchor="middle" font-size="18">🍳</text><text x="324" y="731" text-anchor="middle" class="tab">Rezepte</text>
</svg>
