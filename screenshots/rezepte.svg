<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
<defs>
<linearGradient id="bgBtn" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#4A8C2A"/><stop offset="100%" stop-color="#2D5A1E"/>
